[package]
name = "r2t2_rust"
version = "0.1.0"
edition = "2024"
description = "Pure-Rust CLI and server for Confucius4-R2T2 speech recognition via llama.cpp"

[lib]
name = "r2t2"
path = "src/lib.rs"

[[bin]]
name = "r2t2"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
hound = "3"

# WebSocket service
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "signal", "time", "fs"] }
axum = { version = "0.8", features = ["ws", "multipart"] }
futures-util = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Voice activity detection: WebRTC's C implementation behind a thin binding.
# Chosen over a neural VAD for the same reason llama.cpp was chosen over vLLM:
# a small, self-contained C dependency with no model download.
webrtc-vad = "0.4"

# The web interface: multipart uploads for the API, and the built frontend
# embedded in the binary so a deployment is a single file.
rust-embed = "8"

# Fetching the model on first use. `blocking` keeps the download off the async
# runtime, and `rustls-tls` avoids a system OpenSSL dependency.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "gzip"] }

[build-dependencies]
bindgen = "0.72"

# The integration client in examples/ speaks the wire protocol directly, so it
# does not depend on any Python tooling being installed.
[dev-dependencies]
tokio-tungstenite = "0.28"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
